name: Validate project narrative

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate fragments and compiled narrative
        uses: ./
        with:
          mode: check

  require-narrative-sections:
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'narrative-required')
    steps:
      # Pre-merge mirror of the post-merge maintain gate: a narrative-required PR
      # body must carry the same non-empty H2 sections the maintain action reads,
      # so a missing heading fails review instead of silently failing after merge.
      - name: Require narrative sections in the PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          node - <<'NODE'
          const body = (process.env.PR_BODY || "").replace(/\r\n?/g, "\n");
          const headings = [...body.matchAll(/^## ([^\r\n]+)[ \t]*$/gm)];
          const section = (heading) => headings
            .map((match, index) => ({
              heading: match[1],
              content: body.slice(match.index + match[0].length, headings[index + 1]?.index).trim(),
            }))
            .filter((item) => item.heading === heading);
          const kind = section("Narrative Kind");
          const missing = ["Narrative Context", "Narrative Decision", "Narrative Consequences"]
            .filter((heading) => !section(heading)[0]?.content);
          const kinds = new Set(["product", "architecture", "governance", "operational", "correction", "experiment"]);
          if (!kind.length || kind.length > 1 || !kinds.has(kind[0]?.content)) {
            console.error("::error::narrative-required PR body must contain exactly one non-empty ## Narrative Kind with a canonical value: product, architecture, governance, operational, correction, or experiment");
            process.exit(1);
          }
          if (missing.length) {
            console.error(
              `::error::narrative-required PR body must contain non-empty '## ' sections: ${missing.join(", ")}`,
            );
            process.exit(1);
          }
          console.log("All required narrative sections are present.");
          NODE
